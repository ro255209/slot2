<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二周年抽獎系統</title>

<style>
body{
font-family:"Microsoft JhengHei",sans-serif;
background:linear-gradient(180deg,#0f2027,#203a43,#2c5364);
color:#fff;text-align:center;padding:20px;
}
#wrapper{max-width:420px;margin:auto;}

.slot{
font-size:36px;height:60px;line-height:60px;
background:#0006;border-radius:12px;margin:20px auto;
}

button{
padding:12px 24px;margin:8px;border:none;border-radius:20px;
}
#startBtn{background:#1abc9c;}
#resetBtn{background:#e74c3c;color:#fff;}

#result{font-size:20px;margin-top:10px;}
#desc{
margin-top:10px;
padding:10px;
background:#ffffff22;
border-radius:10px;
font-size:15px;
}

.code{font-size:12px;color:#ffd;}
ul{list-style:none;padding:0;font-size:14px;}
</style>
</head>

<body>
<div id="wrapper">

<h2>🎰 媳婦店鋪二周年慶消費抽獎活動</h2>

<div id="notice">
<b>📢 活動說明</b><br>
① 壹筆消費滿額￥10,000以上限抽一次<br>
② 如抽中九折優待請手機拍照並加入官方LINE與小幫手領獎<br>
③ 除現場獎可直接領取外，優惠券限下次消費使用<br>
⚠️確保顧客權益，本抽獎系統前後端皆會同步紀錄抽獎資料<br>
</div>

<div class="slot" id="slotText">請開始</div>

<button id="startBtn" onclick="startLottery()">開始</button>
<button id="resetBtn" onclick="resetHistory()">重置紀錄</button>

<div id="result"></div>
<div id="desc"></div>

<ul id="history"></ul>

</div>
<footer id="footer">
    <div class="divider"></div>
    <p>© 2024-2026 媳婦店鋪 ‧ 版權所有</p>
    <p class="signature">V1.1_Designed by <span class="author">月半</span></p>
</footer>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvulhuvxfZ-a1ymUhS5WPmWYLy0kyxgY1Sc0vmK1uif97a2MQSQv1jFs5x0KtGvwcE/exec";

// 🎁 獎項 + 說明
const prizes = [
    { name: "🏆 九折優惠券壹張", weight: 15, desc: "來店消費九折優惠券，憑拍照截圖發送至官方賴領取，限收到後下次消費使用" },
    { name: "🥈 隨機禮盒壹盒", weight: 15, desc: "隨機禮盒壹盒，請向現場工作人員詢問領取" },
    { name: "🥉 隨機糖果壹包", weight: 20, desc: "隨機糖果壹包，請向現場工作人員詢問領取" },
    { name: "🎁 苦瓜脆片壹包", weight: 25, desc: "苦瓜脆片壹包(口味隨機),請向現場工作人員詢問領取" },
    { name: "🎁 精選小禮物壹份", weight: 25, desc: "精選小禮物壹份,請向現場工作人員詢問領取" },
];

let historyData = [];
let spinning = false;

// 🟢 頁面載入時：從 localStorage 恢復紀錄
window.onload = function() {
    const saved = localStorage.getItem("lottery_history");
    if (saved) {
        historyData = JSON.parse(saved);
        renderHistory();
    }
};

function weightedRandom() {
    const total = prizes.reduce((s, p) => s + p.weight, 0);
    let r = Math.random() * total;
    for (const p of prizes) {
        if (r < p.weight) return p;
        r -= p.weight;
    }
}

function generateCode() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let code = "202603";
    for (let i = 0; i < 12; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
}

async function startLottery() {
    if (spinning) return;
    spinning = true;

    const btn = document.getElementById("startBtn");
    btn.disabled = true;

    document.getElementById("result").innerText = "抽獎中...";
    document.getElementById("desc").innerText = "";

    const slot = document.getElementById("slotText");
    const texts = prizes.map(p => p.name);
    let index = 0;

    // 動畫效果
    const speeds = [...Array(15).fill(80), ...Array(10).fill(150), ...Array(5).fill(350)];
    for (const s of speeds) {
        slot.innerText = texts[index % texts.length];
        index++;
        await new Promise(r => setTimeout(r, s));
    }

    const prize = weightedRandom();
    const code = generateCode();
    const now = new Date().toLocaleString(); // 取得當前時間

    slot.innerText = prize.name;

    document.getElementById("result").innerHTML =
        `🎉 抽中：${prize.name}<br><span class="code">驗證碼：${code}</span>`;

    document.getElementById("desc").innerHTML =
        `🎁 獎項說明：<br>${prize.desc}`;

    // 1. 發送到 Google Sheet (非同步)
    sendToSheet(prize, code);

    // 2. 存入 localStorage (包含時間)
    const record = {
        name: prize.name,
        code: code,
        time: now
    };
    historyData.unshift(record); 
    if (historyData.length > 10) historyData.length = 10; // 只留10筆
    
    localStorage.setItem("lottery_history", JSON.stringify(historyData));
    renderHistory();

    // 3. 倒數計時鎖定
    let cd = 10;
    btn.innerText = `請稍候 ${cd}s`;
    const t = setInterval(() => {
        cd--;
        if (cd <= 0) {
            clearInterval(t);
            btn.innerText = "開始";
            btn.disabled = false;
            spinning = false;
        } else {
            btn.innerText = `請稍候 ${cd}s`;
        }
    }, 1000);
}

function sendToSheet(prize, code) {
    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            prize: prize.name,
            desc: prize.desc,
            code: code,
            device: navigator.userAgent
        })
    }).catch(e => console.error("雲端備份失敗"));
}

function renderHistory() {
    const ul = document.getElementById("history");
    ul.innerHTML = "<b>🕒 最近 10 筆抽獎紀錄：</b>";
    historyData.forEach((h, i) => {
        const li = document.createElement("li");
        li.style.borderBottom = "1px dotted #555";
        li.style.padding = "5px 0";
        li.innerHTML = `<small style="color:#aaa">${h.time}</small><br>${i + 1}. ${h.name} [${h.code}]`;
        ul.appendChild(li);
    });
}

function resetHistory() {
    const pw = prompt("請輸入重置密碼");
    if (pw === "16888") {
        historyData = [];
        localStorage.removeItem("lottery_history"); // 清除本地儲存
        renderHistory();
        document.getElementById("result").innerText = "✅ 已清除紀錄";
        document.getElementById("desc").innerText = "";
    } else if (pw !== null) {
        alert("❌ 密碼錯誤");
    }
}

// 防止誤觸關閉
window.onbeforeunload = function(e) {
  // 現代瀏覽器通常會忽略此處的自定義文字，僅顯示默認提示
  var message = "此操作將喪失抽獎權益，確定要離開嗎？";
  e = e || window.event;
  if (e) {
    e.returnValue = message; // 兼容舊版
  }
  return message;
};
</script>
</body>

</html>
