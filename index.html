<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媳婦店鋪二周年抽獎系統</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: linear-gradient(180deg, #0f2027, #203a43, #2c5364);
            color: #fff; text-align: center; padding: 20px; min-height: 100vh;
            margin: 0; display: flex; flex-direction: column;
        }
        #wrapper { max-width: 420px; margin: auto; flex: 1; }
        
        /* 鎖定狀態的按鈕樣式 */
        #startBtn { 
            padding: 15px 24px; margin: 8px; border: none; border-radius: 25px; 
            cursor: pointer; font-weight: bold; width: 85%; font-size: 18px;
            background: #34495e; color: #bdc3c7; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        /* 解鎖後的按鈕樣式 */
        #startBtn.unlocked {
            background: #1abc9c; color: white;
        }
        #startBtn:disabled { background: #7f8c8d !important; cursor: not-allowed; opacity: 0.6; }

        .slot {
            font-size: 32px; height: 80px; line-height: 80px;
            background: rgba(0, 0, 0, 0.4); border-radius: 12px; margin: 20px auto;
            border: 2px solid #1abc9c; box-shadow: 0 0 15px rgba(26, 188, 156, 0.2);
        }

        #resetBtn { background: transparent; color: rgba(255,255,255,0.2); font-size: 11px; margin-top: 30px; border: 1px solid rgba(255,255,255,0.1); border-radius: 5px; cursor: pointer; }
        #result { font-size: 20px; margin-top: 15px; color: #f1c40f; font-weight: bold; min-height: 1.5em; }
        #desc { margin-top: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; font-size: 14px; line-height: 1.6; min-height: 40px; }

        .code-tag { font-size: 13px; color: #ffd; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; font-family: monospace; }
        #history { list-style: none; padding: 0; font-size: 13px; text-align: left; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); }
        #history li { padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        
        #footer { margin-top: 40px; padding-bottom: 20px; color: rgba(255, 255, 255, 0.4); font-size: 12px; }
        .divider { width: 30px; height: 1px; background: #1abc9c; margin: 15px auto; opacity: 0.5; }
        .uid-tag { font-family: monospace; letter-spacing: 1px; margin-top: 5px; color: rgba(255,255,255,0.3); }
        .author { color: #ffd; font-weight: bold; }
    </style>
</head>

<body>
<div id="wrapper">
    <h2>🎰 媳婦店鋪二周年慶消費抽獎活動</h2>
    
    <div id="notice" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; font-size: 14px; text-align: left; border-left: 4px solid #1abc9c;">
        <b>📢 活動說明</b><br>
① 壹筆消費滿額￥10,000以上限抽一次<br>
② 如抽中九折優待，請手機拍照中獎畫面並加入官方LINE與小幫手領獎<br>
③ 除現場獎可直接領取外，優惠券限隔日後下次消費使用<br>
⚠️確保顧客權益，本抽獎系統前後端皆會同步紀錄抽獎資料<br>
    </div>

    <div class="slot" id="slotText">LOCKED</div>

    <button id="startBtn" onclick="handleButtonClick()">點擊輸入密碼解鎖</button>

    <div id="result"></div>
    <div id="desc"></div>

    <ul id="history"></ul>
    
    <button id="resetBtn" onclick="resetHistory()">清除紀錄 (需管理密碼)</button>
</div>

<footer id="footer">
    <div class="divider"></div>
    <p>© 2024-2026 媳婦店鋪 ‧ 版權所有</p>
    <div class="uid-tag" id="footerUid">Device ID: Loading...</div>
    <p class="signature">Designed by <span class="author">V1.05 By 月半</span></p>
</footer>

<script>
/** * 🔧 設定區 
 */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHoxv1P3yIVjZ9yosVIBKzxNkvNCds4_5sWGGuupxllux9AHiyHbLgApR3-qbiHTsZ9Q/exec"; // 記得填入
const UNLOCK_PASSWORD = "777";         // 重新整理後的啟動密碼
const ADMIN_PASSWORD = "1688";          // 清除歷史紀錄的密碼

const prizes = [
    { name: "👜 花園鰻帆布袋壹個", weight: 1, desc: "店鋪限定-花園鰻帆布袋壹個，請向現場工作人員領取。" },
    { name: "🏆 九折優惠券壹張", weight: 14, desc: "來店消費九折優惠券，請拍照此畫面聯繫官方LINE領取，⚠️限隔日後下次消費使用。" },
    { name: "🥈 隨機禮盒壹盒", weight: 15, desc: "隨機禮盒壹盒，請向現場工作人員領取。" },
    { name: "🥉 隨機糖果壹包", weight: 20, desc: "隨機糖果壹包，請向現場工作人員領取。" },
    { name: "🎁 苦瓜脆片壹包", weight: 25, desc: "苦瓜脆片壹包(口味隨機)，請向現場工作人員領取。" },
    { name: "🎁 精選小禮物壹份", weight: 25, desc: "精選小禮物壹份，請向現場工作人員領取。" },
];

/** * 核心邏輯 
 */
let isUnlocked = false; 
let historyData = [];
let spinning = false;

window.onload = function() {
    // 1. 恢復紀錄
    const saved = localStorage.getItem("lottery_history");
    if (saved) {
        historyData = JSON.parse(saved);
        renderHistory();
    }
    // 2. 顯示 Device ID
    document.getElementById("footerUid").innerText = "Device ID: " + getDeviceUID();
};

function getDeviceUID() {
    let uid = localStorage.getItem("device_uid");
    if (!uid) {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let randomPart = "";
        for (let i = 0; i < 6; i++) randomPart += chars[Math.floor(Math.random() * chars.length)];
        uid = "DEV-" + new Date().getFullYear().toString().slice(-2) + randomPart;
        localStorage.setItem("device_uid", uid);
    }
    return uid;
}

// 處理按鈕點擊 (判斷是解鎖還是抽獎)
function handleButtonClick() {
    if (!isUnlocked) {
        const pw = prompt("請輸入啟動密碼以開始抽獎活動：");
        if (pw === UNLOCK_PASSWORD) {
            isUnlocked = true;
            const btn = document.getElementById("startBtn");
            btn.innerText = "開始抽獎";
            btn.classList.add("unlocked");
            document.getElementById("slotText").innerText = "READY";
            alert("系統已啟動，請開始抽獎。");
        } else if (pw !== null) {
            alert("密碼錯誤！");
        }
        return;
    }
    startLottery();
}

function generateCode() {
    const now = new Date();
    const dateStr = now.getFullYear().toString().slice(-2) + 
                    (now.getMonth() + 1).toString().padStart(2, '0') + 
                    now.getDate().toString().padStart(2, '0');
    
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let randomPart = "";
    for (let i = 0; i < 12; i++) randomPart += chars[Math.floor(Math.random() * chars.length)];
    return dateStr + randomPart;
}

function weightedRandom() {
    const total = prizes.reduce((s, p) => s + p.weight, 0);
    let r = Math.random() * total;
    for (const p of prizes) {
        if (r < p.weight) return p;
        r -= p.weight;
    }
}

async function startLottery() {
    if (spinning || !isUnlocked) return;
    spinning = true;

    const btn = document.getElementById("startBtn");
    btn.disabled = true;
    document.getElementById("result").innerText = "";
    document.getElementById("desc").innerText = "";

    const slot = document.getElementById("slotText");
    const texts = prizes.map(p => p.name);
    
    // 模擬抽獎動畫
    for (let i = 0; i < 30; i++) {
        slot.innerText = texts[i % texts.length];
        await new Promise(r => setTimeout(r, 40 + (i * 10))); 
    }

    const prize = weightedRandom();
    const code = generateCode();
    const now = new Date().toLocaleString();

    slot.innerText = prize.name;
    document.getElementById("result").innerHTML = `🎉恭喜您抽中 - ${prize.name}<br><span class="code-tag">驗證碼：${code}</span>`;
    document.getElementById("desc").innerHTML = `<b>獎項說明：</b><br>${prize.desc}`;

    // 紀錄與傳送
    const record = { name: prize.name, code: code, time: now };
    historyData.unshift(record);
    if (historyData.length > 10) historyData.length = 10;
    localStorage.setItem("lottery_history", JSON.stringify(historyData));
    renderHistory();
    sendToSheet(prize, code);

    // 冷卻時間
    let cd = 10;
    const t = setInterval(() => {
        cd--;
        btn.innerText = cd > 0 ? `請稍候 ${cd}s` : "開始抽獎";
        if (cd <= 0) { clearInterval(t); btn.disabled = false; spinning = false; }
    }, 1000);
}

function sendToSheet(prize, code) {
    const uid = getDeviceUID();
    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
            prize: prize.name,
            desc: prize.desc,
            code: code,
	    uid: uid,
            device: navigator.userAgent
        })
    }).catch(e => console.log("Cloud Save Skip"));
}

function renderHistory() {
    const ul = document.getElementById("history");
    ul.innerHTML = "<li style='border:none; color:#1abc9c; font-weight:bold;'>🕒 本設備最近 10 筆抽獎紀錄：</li>";
    historyData.forEach((h, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<small style="color:#aaa">${h.time}</small><br>${i+1}. ${h.name} <span class='code-tag'>${h.code}</span>`;
        ul.appendChild(li);
    });
}

function resetHistory() {
    if (prompt("請輸入管理密碼以清除所有歷史紀錄：") === ADMIN_PASSWORD) {
        localStorage.removeItem("lottery_history");
        historyData = [];
        renderHistory();
        alert("歷史紀錄已成功清除！");
    } else {
        alert("密碼錯誤，操作取消。");
    }
}
// 防止誤觸關閉
window.onbeforeunload = function(e) {
  // 現代瀏覽器通常會忽略此處的自定義文字，僅顯示默認提示
  var message = "此操作將喪失抽獎權益，確定要離開嗎？";
  e = e || window.event;
  if (e) {
    e.returnValue = message; // 兼容舊版
  }
  return message;
};
</script>
</body>

</html>
